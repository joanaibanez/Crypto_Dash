name: Atualizar dados e publicar no GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *" # a cada hora
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Baixar dados do Yahoo Finance
        run: python scripts/fetch_data.py

      - name: Montar site
        run: |
          mkdir -p _site/data
          cp index.html .nojekyll _site/
          cp data/crypto.json _site/data/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
